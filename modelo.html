<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>/*__TITLE__*/</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Caveat:wght@600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#e9e4da;--muted:#8a857c;--accent:#d8261c;--bar:#141212;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--fg:#e9e4da;--bar:#141212}}
:root[data-theme="dark"]{--bg:#000;--fg:#e9e4da;--bar:#141212}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Oswald,"Arial Narrow",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
#stage{position:relative;aspect-ratio:9/16;
  width:min(calc(100vw - 16px),calc((100dvh - 110px) * 9 / 16));}
canvas{width:100%;height:100%;display:block;border-radius:10px;background:#000}
#big{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;padding:14px 26px;
  font:500 20px Oswald,"Arial Narrow",sans-serif;letter-spacing:.02em;color:#fff;background:rgba(150,12,8,.85);
  border:1px solid rgba(255,255,255,.25);border-radius:40px;cursor:pointer}
#big:focus-visible,#bar button:focus-visible,#seek:focus-visible{outline:2px solid #fff;outline-offset:3px}
#bar{display:flex;align-items:center;gap:10px;width:min(calc(100vw - 16px),calc((100dvh - 110px) * 9 / 16));
  min-width:280px;background:var(--bar);border-radius:30px;padding:6px 12px}
#bar button{background:none;border:0;color:var(--fg);font-size:18px;width:34px;height:34px;cursor:pointer;border-radius:50%}
#seek{flex:1;accent-color:var(--accent)}
#time{font-size:14px;color:var(--muted);min-width:78px;text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="720" height="1280"></canvas>
  <button id="big">▶ Assistir com som</button>
</div>
<div id="bar">
  <button id="pp" aria-label="Tocar ou pausar">▶</button>
  <input id="seek" type="range" min="0" max="60" step="0.01" value="0" aria-label="Posição no vídeo">
  <span id="time">0:00</span>
  <button id="px" aria-label="Alternar visual pixelado">▦</button>
  <button id="mute" aria-label="Som ligado ou mudo">🔊</button>
</div>
<script>
/*__MOTOR__*/
</script>
<script>
/*__VIDEO__*/
</script>
<script>
(()=>{
const E=ENGINE,V=VIDEO,DUR=V.dur;E.prepDLG(V.dlg||[]);
E.init({createCanvas:(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c}});
if(document.fonts&&document.fonts.load)document.fonts.load('36px "Press Start 2P"');
const cv=document.getElementById('cv'),big=document.getElementById('big'),pp=document.getElementById('pp'),seek=document.getElementById('seek'),timeEl=document.getElementById('time'),muteB=document.getElementById('mute');
seek.max=DUR;
let A=null,S=null,playing=false,started=false,t0=0,base=0,muted=false,dragging=false,PIX=true,unlockEl=null;
function unlockIOS(){try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
 try{if(!unlockEl){const sr=8000,n=sr/2,buf=new ArrayBuffer(44+n),v=new DataView(buf),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
  for(let i=0;i<n;i++)v.setUint8(44+i,128);let b='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i++)b+=String.fromCharCode(u[i]);
  unlockEl=document.createElement('audio');unlockEl.src='data:audio/wav;base64,'+btoa(b);unlockEl.loop=true;unlockEl.setAttribute('playsinline','')}
  const p=unlockEl.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function now(){if(!playing)return t0;return Math.min(DUR,t0+Math.max(0,A.ac.currentTime-base))}
function play(from){unlockIOS();if(!A){A=E.audioInit(new (window.AudioContext||window.webkitAudioContext)());A.out.gain.value=muted?0:1}
 if(A.ac.state!=='running')A.ac.resume();if(from>=DUR-.05)from=0;E.stopSession(S);t0=from;base=A.ac.currentTime+.06;S=E.session(A,from,V,base);
 playing=true;started=true;big.style.display='none';pp.textContent='⏸'}
function pause(){t0=now();playing=false;E.stopSession(S);S=null;pp.textContent='▶'}
big.onclick=()=>play(0);pp.onclick=()=>playing?pause():play(t0);
seek.addEventListener('input',()=>{dragging=true;const v=+seek.value;if(playing)play(v);else{t0=v;started=true;big.style.display='none'}});
seek.addEventListener('change',()=>{dragging=false});
document.getElementById('px').onclick=()=>{PIX=!PIX};
muteB.onclick=()=>{muted=!muted;muteB.textContent=muted?'🔇':'🔊';if(A)A.out.gain.value=muted?0:1};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();playing?pause():play(started?t0:0)}});
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function loop(){let t=now();if(playing&&t>=DUR){pause();t0=DUR;t=DUR;pp.textContent='↺'}
 E.frame(cv,started?t:(V.poster??1),V,{pixel:PIX});if(!dragging)seek.value=t;timeEl.textContent=`${fmt(t)} / ${fmt(DUR)}`;requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
