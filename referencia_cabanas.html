<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escolha uma cabana — teste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Caveat:wght@600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#e9e4da;--muted:#8a857c;--accent:#d8261c;--bar:#141212;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--fg:#e9e4da;--bar:#141212}}
:root[data-theme="dark"]{--bg:#000;--fg:#e9e4da;--bar:#141212}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Oswald,"Arial Narrow",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
#stage{position:relative;aspect-ratio:9/16;
  width:min(calc(100vw - 16px),calc((100dvh - 110px) * 9 / 16));}
canvas{width:100%;height:100%;display:block;border-radius:10px;background:#000}
#big{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;padding:14px 26px;
  font:500 20px Oswald,"Arial Narrow",sans-serif;letter-spacing:.02em;color:#fff;background:rgba(150,12,8,.85);
  border:1px solid rgba(255,255,255,.25);border-radius:40px;cursor:pointer}
#big:focus-visible,#bar button:focus-visible,#seek:focus-visible{outline:2px solid #fff;outline-offset:3px}
#bar{display:flex;align-items:center;gap:10px;width:min(calc(100vw - 16px),calc((100dvh - 110px) * 9 / 16));
  min-width:280px;background:var(--bar);border-radius:30px;padding:6px 12px}
#bar button{background:none;border:0;color:var(--fg);font-size:18px;width:34px;height:34px;cursor:pointer;border-radius:50%}
#seek{flex:1;accent-color:var(--accent)}
#time{font-size:14px;color:var(--muted);min-width:78px;text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="720" height="1280"></canvas>
  <button id="big">▶ Assistir com som</button>
</div>
<div id="bar">
  <button id="pp" aria-label="Tocar ou pausar">▶</button>
  <input id="seek" type="range" min="0" max="60" step="0.01" value="0" aria-label="Posição no vídeo">
  <span id="time">0:00 / 1:00</span>
  <button id="px" aria-label="Alternar visual pixelado">▦</button>
  <button id="mute" aria-label="Som ligado ou mudo">🔊</button>
</div>
<script>
(()=>{
const W=1080,H=1920,DUR=60,SC=720/1080;
const cv=document.getElementById('cv'),G0=cv.getContext('2d');let g=G0;const LO=document.createElement('canvas');LO.width=360;LO.height=640;const GL=LO.getContext('2d');let PIX=true;const PX='"Press Start 2P", "Courier New", monospace';if(document.fonts&&document.fonts.load)document.fonts.load('36px "Press Start 2P"');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sm=(a,b,x)=>{const k=clamp((x-a)/(b-a),0,1);return k*k*(3-2*k)};
const win=(t,a,b,f)=>Math.min(sm(a,a+f,t),1-sm(b-f,b,t));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=x=>{const s=Math.sin(x*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const FONT='Oswald, "Arial Narrow", Impact, sans-serif';

/* ---------- mundo ---------- */
const R=rng(7);
const LAYERS=[
 {color:'#161d2e',base:1330,trees:[]},
 {color:'#0c111c',base:1440,trees:[]},
 {color:'#030407',base:1650,trees:[]}];
for(let i=0;i<30;i++){const h=180+R()*160;LAYERS[0].trees.push({x:-120+(i+R()*.8)*(1320/30),h,w:h*.4})}
for(let i=0;i<18;i++){const h=300+R()*220;LAYERS[1].trees.push({x:-120+(i+R()*.8)*(1320/18),h,w:h*.38})}
for(const x of [-70,80,190,900,1010,1150]){const h=760+R()*380;LAYERS[2].trees.push({x,h,w:h*.36})}
const STARS=[];for(let i=0;i<90;i++)STARS.push({x:R()*W,y:R()*900,r:1+R()*2.2,a:.3+R()*.6,f:1+R()*3,p:R()*6});
const SNOW=[];for(let i=0;i<100;i++)SNOW.push({x:R()*W,y:R()*H,sp:40+R()*80,s:2+R()*3,ph:R()*6});

function pine(x,base,h,w){
 g.beginPath();
 for(let i=0;i<5;i++){const top=base-h+i*h*.17,tw=w*(.3+i*.2),bot=top+h*.3;g.moveTo(x,top);g.lineTo(x-tw/2,bot);g.lineTo(x+tw/2,bot);g.closePath()}
 g.rect(x-w*.05,base-h*.2,w*.1,h*.2);g.fill();
}
function fog(y,t,a){
 for(let i=0;i<4;i++){
  const x=((i*420+t*(18+i*6))%(W+900))-450;
  g.save();g.translate(x,y+Math.sin(t*.3+i)*20);g.scale(3.2,1);
  const r=g.createRadialGradient(0,0,0,0,0,180);
  r.addColorStop(0,`rgba(130,145,175,${a})`);r.addColorStop(1,'rgba(130,145,175,0)');
  g.fillStyle=r;g.fillRect(-180,-180,360,360);g.restore();
 }
}
function drawWorld(o){
 const t=o.t;g.save();
 g.translate(W/2,H/2);g.scale(o.s||1,o.s||1);g.translate(-W/2+(o.cx||0),-H/2+(o.cy||0));
 const sg=g.createLinearGradient(0,0,0,1500);
 sg.addColorStop(0,'#04060b');sg.addColorStop(.6,'#101829');sg.addColorStop(1,'#1c2436');
 g.fillStyle=sg;g.fillRect(-600,-600,W+1200,H+1200);
 g.fillStyle='#cfd8ff';
 for(const s of STARS){g.globalAlpha=s.a*(.6+.4*Math.sin(t*s.f+s.p));g.fillRect(s.x,s.y,s.r,s.r)}
 g.globalAlpha=1;
 const [mx,my]=o.moon,mr=o.mr||64;
 const mg=g.createRadialGradient(mx,my,mr*.8,mx,my,mr*5);
 mg.addColorStop(0,'rgba(190,205,255,.22)');mg.addColorStop(1,'rgba(190,205,255,0)');
 g.fillStyle=mg;g.fillRect(mx-mr*5,my-mr*5,mr*10,mr*10);
 g.fillStyle='#e6e9f2';g.beginPath();g.arc(mx,my,mr,0,Math.PI*2);g.fill();
 g.fillStyle='rgba(60,70,100,.12)';
 g.beginPath();g.arc(mx-mr*.3,my-mr*.2,mr*.22,0,7);g.arc(mx+mr*.35,my+mr*.25,mr*.16,0,7);g.fill();
 g.fillStyle='rgba(8,12,22,.6)';g.beginPath();
 g.ellipse(mx-260+((t*14)%520),my+mr*.2,mr*2.4,mr*.28,0,0,7);g.fill();
 LAYERS.forEach((L,li)=>{
  if(li===2&&!o.near)return;
  g.fillStyle=L.color;
  for(const tr of L.trees)pine(tr.x,L.base,tr.h,tr.w);
  g.fillRect(-600,L.base-2,W+1200,2000);
  if(li===0)fog(1320,t,.10);
  if(li===1){fog(1440,t,.09);if(o.afterMid)o.afterMid()}
 });
 g.fillStyle='#fff';
 for(const p of SNOW){const y=(p.y+t*p.sp)%H;g.globalAlpha=.3;g.fillRect(p.x+Math.sin(t*.7+p.ph)*20,y,p.s,p.s)}
 g.globalAlpha=1;g.restore();
}

/* ---------- elementos ---------- */
const PLAID=(()=>{const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');
 x.fillStyle='#7a1414';x.fillRect(0,0,16,16);x.fillStyle='rgba(20,5,5,.55)';x.fillRect(0,6,16,4);x.fillRect(6,0,4,16);
 x.fillStyle='rgba(255,220,180,.18)';x.fillRect(0,13,16,1);x.fillRect(13,0,1,16);return c})();
let plaidPat=null;
function ground(y,col1,col2){const gg=g.createLinearGradient(0,y,0,y+700);gg.addColorStop(0,col1);gg.addColorStop(1,col2);g.fillStyle=gg;g.fillRect(-600,y,W+1200,1400)}
function deadTree(x,base,h,seed,col){
 const r=rng(seed);g.strokeStyle=col;g.lineCap='round';
 const br=(x,y,len,ang,d,w)=>{const x2=x+Math.sin(ang)*len,y2=y-Math.cos(ang)*len;g.lineWidth=w;g.beginPath();g.moveTo(x,y);
  g.quadraticCurveTo(x+Math.sin(ang+.35)*len*.5,y-Math.cos(ang+.35)*len*.5,x2,y2);g.stroke();
  if(d>0){br(x2,y2,len*(.6+r()*.2),ang-.35-r()*.45,d-1,w*.62);br(x2,y2,len*(.55+r()*.2),ang+.3+r()*.45,d-1,w*.62);if(r()<.4)br(x2,y2,len*.4,ang+(r()-.5),d-1,w*.5)}};
 br(x,base,h*.42,(r()-.5)*.2,5,h*.07);
}
function crow(x,y,s,fly,ph){
 g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='#030303';
 g.beginPath();g.ellipse(0,0,26,14,-.1,0,7);g.fill();
 g.beginPath();g.arc(22,-12,10,0,7);g.fill();
 g.beginPath();g.moveTo(30,-15);g.lineTo(46,-9);g.lineTo(30,-7);g.fill();
 g.beginPath();g.moveTo(-22,-4);g.lineTo(-48,2);g.lineTo(-22,9);g.fill();
 if(fly){const a=Math.cos(ph);
  g.beginPath();g.moveTo(-10,-4);g.lineTo(-30,-4-60*a);g.lineTo(-4,-50*a);g.lineTo(12,-4);g.fill();
 }else{g.strokeStyle='#030303';g.lineWidth=3;g.beginPath();g.moveTo(-2,12);g.lineTo(-4,24);g.moveTo(6,12);g.lineTo(6,24);g.stroke()}
 g.restore();
}
function rocker(x,y,ang,flip){
 g.save();g.translate(x,y);if(flip)g.scale(-1,1);g.rotate(ang);
 g.strokeStyle='#170d06';g.lineWidth=8;g.lineCap='round';
 g.beginPath();g.moveTo(-8,-6);g.lineTo(-22,-128);g.moveTo(40,-6);g.lineTo(40,-58);g.moveTo(-14,-58);g.lineTo(46,-58);
 g.moveTo(-30,4);g.quadraticCurveTo(10,18,64,2);g.stroke();
 g.lineWidth=5;for(let i=0;i<3;i++){g.beginPath();g.moveTo(-12-i*3,-70-i*18);g.lineTo(-24-i*3+8,-72-i*18);g.stroke()}
 g.beginPath();g.moveTo(-10,-100);g.lineTo(-22,-100);g.stroke();
 g.restore();
}
function cabin1(x,y,s,t){
 if(!plaidPat)plaidPat=g.createPattern(PLAID,'repeat');
 g.save();g.translate(x,y);g.scale(s,s);
 const gg=g.createRadialGradient(0,0,10,0,0,520);gg.addColorStop(0,'rgba(255,150,60,.3)');gg.addColorStop(1,'rgba(255,150,60,0)');
 g.fillStyle=gg;g.fillRect(-520,-400,1040,700);
 // marcas de arrasto na neve
 g.strokeStyle='rgba(12,14,22,.55)';g.lineWidth=10;g.lineCap='round';
 g.beginPath();g.moveTo(-30,4);g.bezierCurveTo(-60,120,-240,160,-300,340);g.stroke();
 g.beginPath();g.moveTo(30,4);g.bezierCurveTo(10,130,-150,190,-170,360);g.stroke();
 // lenha com osso
 for(let r=0;r<4;r++)for(let c=0;c<4-r%2;c++){const lx=-420+c*30+(r%2)*15,ly=-14-r*27;
  g.fillStyle='#4a2f1a';g.beginPath();g.arc(lx,ly,14,0,7);g.fill();g.strokeStyle='#7a5634';g.lineWidth=2;g.beginPath();g.arc(lx,ly,7,0,7);g.stroke()}
 g.save();g.translate(-370,-118);g.rotate(-.5);g.fillStyle='#e6dfd0';
 g.fillRect(-26,-5,52,10);for(const bx of [-26,26])for(const by of [-6,6]){g.beginPath();g.arc(bx,by,7,0,7);g.fill()}g.restore();
 g.translate(0,-40);
 // chaminé de pedra
 g.fillStyle='#2b2622';g.fillRect(110,-410,60,150);
 g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=2;for(let yy=-400;yy<-260;yy+=22)for(let xx=110+((yy/22|0)%2)*14;xx<170;xx+=28)g.strokeRect(xx,yy,28,22);
 for(let i=0;i<14;i++){const ph=(t*.22+i/14)%1;g.fillStyle=`rgba(150,150,160,${(1-ph)*.16})`;
  g.beginPath();g.arc(140+Math.sin(ph*6+i)*34*ph,-410-ph*380,18+ph*60,0,7);g.fill()}
 // paredes de tora
 g.fillStyle='#3a2414';g.fillRect(-230,-262,460,262);
 for(let yy=-262,i=0;yy<0;yy+=26,i++){const lg=g.createLinearGradient(0,yy,0,yy+26);lg.addColorStop(0,'#4d311b');lg.addColorStop(.5,'#3a2414');lg.addColorStop(1,'#1e1209');
  g.fillStyle=lg;g.fillRect(-230,yy,460,26);g.fillStyle='#5a3a20';for(const ex of [-236,236]){g.beginPath();g.arc(ex,yy+13,13,0,7);g.fill()}}
 // telhado com neve
 g.fillStyle='#1a0f08';g.beginPath();g.moveTo(-285,-250);g.lineTo(0,-445);g.lineTo(285,-250);g.closePath();g.fill();
 g.strokeStyle='rgba(215,222,235,.8)';g.lineWidth=12;g.lineJoin='round';g.beginPath();g.moveTo(-285,-256);g.lineTo(0,-451);g.lineTo(285,-256);g.stroke();
 // janelas com cortina xadrez + floreiras
 for(const wx of [-178,88]){
  const f=.85+.15*Math.sin(t*11+wx)*Math.sin(t*6.3+wx*2);
  g.fillStyle='#120904';g.fillRect(wx-7,-218,104,104);
  g.save();g.shadowColor='rgba(255,160,60,.9)';g.shadowBlur=60*f;
  const wg=g.createLinearGradient(0,-211,0,-121);wg.addColorStop(0,`rgb(255,${200*f|0},100)`);wg.addColorStop(1,`rgb(235,${130*f|0},45)`);
  g.fillStyle=wg;g.fillRect(wx,-211,90,90);g.restore();
  g.fillStyle=plaidPat;
  g.beginPath();g.moveTo(wx,-211);g.lineTo(wx+32,-211);g.quadraticCurveTo(wx+14,-170,wx+18,-121);g.lineTo(wx,-121);g.fill();
  g.beginPath();g.moveTo(wx+90,-211);g.lineTo(wx+58,-211);g.quadraticCurveTo(wx+76,-170,wx+72,-121);g.lineTo(wx+90,-121);g.fill();
  g.fillStyle='#120904';g.fillRect(wx+42,-211,6,90);g.fillRect(wx,-169,90,6);
  g.fillStyle='#3a2415';g.fillRect(wx-10,-116,110,22);
  for(let i=0;i<7;i++){g.fillStyle='#2f4a22';g.beginPath();g.arc(wx-2+i*16,-118,7,0,7);g.fill();
   g.fillStyle=i%2?'#c02a2e':'#e0454a';g.beginPath();g.arc(wx+2+i*15,-126-(i%3)*4,7,0,7);g.fill()}
 }
 // porta
 g.fillStyle='#4a2c18';g.fillRect(-48,-185,96,185);
 g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=3;g.strokeRect(-38,-110,76,98);
 g.fillStyle='#ffb45a';g.fillRect(-22,-168,44,40);g.fillStyle='#2a170b';g.fillRect(-2,-168,4,40);
 g.fillStyle='#d6a55a';g.beginPath();g.arc(30,-95,6,0,7);g.fill();
 g.translate(0,40);
 // varanda
 g.fillStyle='#3a2616';g.beginPath();g.moveTo(-320,-40);g.lineTo(320,-40);g.lineTo(350,0);g.lineTo(-350,0);g.fill();
 g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=2;for(let i=1;i<4;i++){const yy=-40+i*10;g.beginPath();g.moveTo(-320-i*7,yy);g.lineTo(320+i*7,yy);g.stroke()}
 g.fillStyle='#24170d';g.fillRect(-350,0,700,22);
 g.fillStyle='#6b4a2a';g.beginPath();g.moveTo(-58,-38);g.lineTo(58,-38);g.lineTo(68,-4);g.lineTo(-68,-4);g.fill();
 g.fillStyle='#e8d8b0';g.font='700 19px '+FONT;g.textAlign='center';g.textBaseline='middle';g.fillText('BEM-VINDO',0,-20);
 g.fillStyle='#1a0f08';g.fillRect(-330,-326,660,16);g.fillRect(-322,-310,14,272);g.fillRect(308,-310,14,272);
 // lampião balançando
 const la=Math.sin(t*1.3)*.08;g.save();g.translate(-110,-310);g.rotate(la);
 g.strokeStyle='#111';g.lineWidth=2;g.beginPath();g.moveTo(0,0);g.lineTo(0,34);g.stroke();
 g.save();g.shadowColor='rgba(255,170,70,1)';g.shadowBlur=40;g.fillStyle='#ffcf7a';g.fillRect(-11,36,22,30);g.restore();
 g.fillStyle='#1a1a1a';g.fillRect(-14,32,28,6);g.fillRect(-14,64,28,6);g.restore();
 // cadeiras de balanço
 const rock=Math.sin(t*2.4)*.13*(1-sm(21.8,22.1,t));
 rocker(-225,-26,rock,false);rocker(225,-26,0,true);
 g.restore();
}
function cabin2(x,y,s,t,opt={}){
 g.save();g.translate(x,y);g.scale(s,s);
 // árvore morta com balanço
 deadTree(420,0,600,11,'#0a0a0c');
 g.strokeStyle='#0a0a0c';g.lineWidth=18;g.lineCap='round';g.beginPath();g.moveTo(420,-330);g.quadraticCurveTo(360,-350,250,-365);g.stroke();
 const sw=Math.sin(t*1.5)*.2;
 g.strokeStyle='#6b5a44';g.lineWidth=4;
 for(const rx of [290,350]){const bx=rx+Math.sin(sw)*240,by=-360+Math.cos(sw)*240;
  g.beginPath();g.moveTo(rx,-360);g.lineTo(bx,by);g.stroke();
  g.lineWidth=2;g.beginPath();g.moveTo(bx,by);g.lineTo(bx-6,by+12);g.moveTo(bx,by);g.lineTo(bx+5,by+14);g.stroke();g.lineWidth=4}
 g.save();g.rotate(-.045);
 // paredes podres
 g.fillStyle='#24211e';g.beginPath();g.moveTo(-240,6);g.lineTo(-232,-270);g.lineTo(232,-252);g.lineTo(246,6);g.fill();
 for(let px=-230,i=0;px<240;px+=30,i++){g.fillStyle=i%3===0?'#1b1917':'#2c2825';g.fillRect(px,-265+i*1.5,28,270-i*1.5);
  if(i%4===1){g.fillStyle='#060606';g.fillRect(px+10,-200+i*5,6,60)}}
 for(const [mx,my,mr] of [[-200,-20,40],[-120,-6,30],[150,-14,46],[210,-40,28],[-230,-90,26]]){g.fillStyle='#1f2a1a';g.beginPath();g.ellipse(mx,my,mr,mr*.55,0,0,7);g.fill()}
 // "NÃO ABRA" pintado
 g.fillStyle='#d6d0c4';g.font='700 46px '+FONT;g.textAlign='center';g.textBaseline='middle';g.fillText('NÃO ABRA',0,-222);
 const dr=rng(5);for(let i=0;i<9;i++){const dx=-80+i*20+dr()*8;g.fillRect(dx,-202,3,10+dr()*38);g.beginPath();g.arc(dx+1.5,-192+dr()*30,3,0,7);g.fill()}
 // janelas
 const wl=-195,wy=-190;g.fillStyle='#050505';g.fillRect(wl-6,wy-6,97,97);g.fillStyle='#070808';g.fillRect(wl,wy,85,85);
 g.save();g.beginPath();g.rect(wl,wy,85,85);g.clip();g.fillStyle='#4a3a2a';
 for(const [p,r] of [[.25,-.2],[.55,.1],[.85,-.12]]){g.save();g.translate(wl+42,wy+85*p);g.rotate(r);g.fillRect(-80,-9,160,18);
  g.fillStyle='#8a8278';g.beginPath();g.arc(-30,0,3,0,7);g.arc(30,0,3,0,7);g.fill();g.fillStyle='#4a3a2a';g.restore()}
 g.restore();
 g.fillStyle='rgba(200,215,235,.45)';
 for(const pts of [[[wl,wy],[wl+30,wy],[wl,wy+40]],[[wl+85,wy],[wl+60,wy],[wl+85,wy+22]],[[wl,wy+85],[wl+22,wy+85],[wl,wy+56]],[[wl+85,wy+85],[wl+85,wy+50],[wl+68,wy+85]]]){g.beginPath();g.moveTo(...pts[0]);g.lineTo(...pts[1]);g.lineTo(...pts[2]);g.fill()}
 const wr=105;g.fillStyle='#050505';g.fillRect(wr-6,wy-12,97,97);g.fillStyle='#0b0c0e';g.fillRect(wr,wy-6,85,85);
 g.strokeStyle='rgba(180,190,210,.35)';g.lineWidth=2;g.beginPath();g.moveTo(wr+50,wy+30);g.lineTo(wr+10,wy);g.moveTo(wr+50,wy+30);g.lineTo(wr+85,wy+10);g.moveTo(wr+50,wy+30);g.lineTo(wr+30,wy+79);g.stroke();
 // porta arranhada com corrente
 g.fillStyle='#0d0c0b';g.fillRect(-50,-185,100,190);
 g.strokeStyle='rgba(205,195,180,.55)';g.lineWidth=3.5;
 for(const [ox,oy] of [[-34,-150],[4,-80]])for(let i=0;i<4;i++){g.beginPath();g.moveTo(ox+i*8,oy);g.lineTo(ox+10+i*8,oy+70);g.stroke()}
 g.strokeStyle='#6a4a30';g.lineWidth=4;

 for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}

}
const reg=(S,n)=>{S.nodes.push(n);return n};
const O=(S,type,f)=>{const o=S.ac.createOscillator();o.type=type;o.frequency.value=f;return reg(S,o)};
const N=S=>{const n=S.ac.createBufferSource();n.buffer=noiseBuf;n.loop=true;return reg(S,n)};
const F=(S,type,f,q)=>{const b=S.ac.createBiquadFilter();b.type=type;b.frequency.value=f;if(q)b.Q.value=q;return b};
const G=(S,v=0)=>{const x=S.ac.createGain();x.gain.value=v;return x};
function env(S,p,pts){
 const t0=S.t0;let v=pts[0][1];
 for(let i=0;i<pts.length;i++){if(pts[i][0]<=t0)v=pts[i][1];else{if(i>0){const [a,va]=pts[i-1],[b,vb]=pts[i];v=va+(vb-va)*(t0-a)/(b-a)}break}}
 p.cancelScheduledValues(0);p.setValueAtTime(v,S.base);
 for(const [x,val] of pts)if(x>t0)p.linearRampToValueAtTime(val,S.at(x));
}
const run=(S,n,end)=>{n.start(S.base,n.buffer?Math.random()*1.5:undefined);n.stop(S.at(end)+.1)};
function shot(S,x,fn){if(x<S.t0-.001)return;fn(S.at(x))}
function burst(S,w,v,dec,filt,f,dest){
 const n=reg(S,S.ac.createBufferSource());n.buffer=noiseBuf;const fl=F(S,filt,f);const gg=G(S);
 gg.gain.setValueAtTime(0,w);gg.gain.linearRampToValueAtTime(v,w+.004);gg.gain.exponentialRampToValueAtTime(.0001,w+dec);
 n.connect(fl);fl.connect(gg);gg.connect(dest||S.master);n.start(w,Math.random()*1.5);n.stop(w+dec+.05);return gg;
}
function tone(S,w,type,f0,f1,v,dec,glide,dest){
 const o=reg(S,S.ac.createOscillator());o.type=type;o.frequency.setValueAtTime(f0,w);o.frequency.exponentialRampToValueAtTime(f1,w+glide);
 const gg=G(S);gg.gain.setValueAtTime(0,w);gg.gain.linearRampToValueAtTime(v,w+.01);gg.gain.exponentialRampToValueAtTime(.0001,w+dec);
 o.connect(gg);gg.connect(dest||S.master);o.start(w);o.stop(w+dec+.05);return gg;
}
function beat(S,x,v){shot(S,x,w=>{
 tone(S,w,'sine',68,40,v,.24,.14);tone(S,w,'triangle',130,80,v*.35,.12,.1);
 tone(S,w+.2,'sine',60,38,v*.6,.22,.14);tone(S,w+.2,'triangle',115,70,v*.22,.1,.1);
})}
function knock(S,x,v){shot(S,x,w=>{
 const a=burst(S,w,v,.13,'lowpass',900);a.connect(S.rev);
 const b=tone(S,w,'sine',140,65,v*.9,.16,.08);b.connect(S.rev);
})}
function whoosh(S,x,dur,v=.3){shot(S,x,w=>{
 const n=reg(S,S.ac.createBufferSource());n.buffer=noiseBuf;const bp=F(S,'bandpass',250,1.4);
 bp.frequency.setValueAtTime(250,w);bp.frequency.exponentialRampToValueAtTime(3200,w+dur);
 const gg=G(S);gg.gain.setValueAtTime(0,w);gg.gain.linearRampToValueAtTime(v,w+dur*.7);gg.gain.exponentialRampToValueAtTime(.0001,w+dur);
 n.connect(bp);bp.connect(gg);gg.connect(S.master);gg.connect(S.rev);n.start(w);n.stop(w+dur+.05);
})}
function creak(S,x,dur,v){shot(S,x,w=>{
 const o=reg(S,S.ac.createOscillator());o.type='sawtooth';
 const r=rng(Math.floor(x*100)),c=new Float32Array(64);for(let i=0;i<64;i++)c[i]=60+r()*55+35*Math.sin(i*.4);
 o.frequency.setValueCurveAtTime(c,w,dur);
 const bp=F(S,'bandpass',1000,5),gg=G(S);
 gg.gain.setValueAtTime(0,w);gg.gain.linearRampToValueAtTime(v,w+.08);gg.gain.setValueAtTime(v,w+dur-.15);gg.gain.linearRampToValueAtTime(0,w+dur);
 o.connect(bp);bp.connect(gg);gg.connect(S.master);gg.connect(S.rev);o.start(w);o.stop(w+dur+.05);
})}
function fire(S,a,b,lvl){
 if(b<=S.t0)return;
 const n=N(S),lp=F(S,'lowpass',500),gg=G(S);
 env(S,gg.gain,[[0,0],[a,0],[a+.5,lvl*.35],[b-.6,lvl*.35],[b,0]]);
 n.connect(lp);lp.connect(gg);gg.connect(S.master);run(S,n,b);
 const r=rng(Math.floor(a*100));
 for(let x=a+.2;x<b-.2;x+=.05+r()*.28){const v=lvl*(.25+r()*.75),d=.03+r()*.05;shot(S,x,w=>burst(S,w,v,d,'highpass',1800))}
}
function voice(S,a,b){
 if(b<=S.t0)return;
 const o=O(S,'sawtooth',165);env(S,o.frequency,[[a,160],[b,215]]);
 const vib=O(S,'sine',5.5),vg=G(S,7);vib.connect(vg);vg.connect(o.frequency);
 const b1=F(S,'bandpass',700,5),b2=F(S,'bandpass',1150,6),lp=F(S,'lowpass',750),gg=G(S);
 if(a>=S.t0){const r=rng(Math.floor(a*10)),c=new Float32Array(16);for(let i=0;i<16;i++)c[i]=520+r()*380;b1.frequency.setValueCurveAtTime(c,S.at(a),b-a)}
 o.connect(b1);o.connect(b2);b1.connect(lp);b2.connect(lp);lp.connect(gg);gg.connect(S.master);gg.connect(S.rev);
 const r=rng(Math.floor(a*7)),pts=[[0,0]];let x=a;
 while(x+.32<b){const d=.14+r()*.16;pts.push([x,0],[x+.04,.55],[x+d*.6,.38],[x+d,.02]);x+=d+.04+r()*.08}
 pts.push([b,0]);env(S,gg.gain,pts);
 run(S,o,b);run(S,vib,b);
}
function caw(S,x,v){shot(S,x,w=>{for(let i=0;i<2;i++){const ww=w+i*.3;const o=reg(S,S.ac.createOscillator());o.type='sawtooth';
 o.frequency.setValueAtTime(760,ww);o.frequency.exponentialRampToValueAtTime(420,ww+.22);
 const bp=F(S,'bandpass',1500,2.5),gg=G(S);gg.gain.setValueAtTime(0,ww);gg.gain.linearRampToValueAtTime(v,ww+.02);gg.gain.exponentialRampToValueAtTime(.0001,ww+.25);
 o.connect(bp);bp.connect(gg);gg.connect(S.master);gg.connect(S.rev);o.start(ww);o.stop(ww+.3)}})}
function blip(S,x,v,i){shot(S,x,w=>{
 if(v==='n'){const f=560+(i%3)*18;tone(S,w,'square',f,f*.97,.028,.045,.04)}
 else{const f=v==='E'?70:95+(i%4)*7;tone(S,w,'sawtooth',f,f*.8,v==='E'?.2:.13,v==='E'?.18:.1,.1).connect(S.rev);tone(S,w,'square',f/2,f/2.2,.07,.1,.1)}})}
function score(S){
 const ac=S.ac;
 shot(S,.3,w=>{tone(S,w,'sine',58,28,.8,2.2,1.6).connect(S.rev);burst(S,w,.5,1.2,'lowpass',180)});
 if(S.t0<40){
  const n=N(S),bp=F(S,'bandpass',450,.8),gg=G(S);
  const l1=O(S,'sine',.11),g1=G(S,260),l2=O(S,'sine',.37),g2=G(S,120);
  l1.connect(g1);g1.connect(bp.frequency);l2.connect(g2);g2.connect(bp.frequency);
  env(S,gg.gain,[[0,0],[1.5,.55],[7.5,.5],[8.2,.3],[20,.28],[23.8,.12],[24.3,.05],[35,.05],[36.6,.02],[37,.12],[38,0],[40,0]]);
  n.connect(bp);bp.connect(gg);gg.connect(S.master);run(S,n,40);run(S,l1,40);run(S,l2,40);
 }
 {const lp=F(S,'lowpass',160,1),gg=G(S);
  env(S,lp.frequency,[[0,160],[14,160],[20,260],[24,160],[47,180],[53,1300],[53.3,160],[60,160]]);
  env(S,gg.gain,[[0,0],[3,.16],[8,.1],[14,.2],[19,.22],[24,.14],[34.5,.12],[36,0],[40,0],[41.5,.06],[44,.09],[47,.1],[50.5,.22],[53.1,.3],[53.25,0],[56,0],[57,.1],[60,0]]);
  for(const [ty,f] of [['sawtooth',55],['sawtooth',55.8],['sine',41.2]]){const o=O(S,ty,f);o.connect(lp);run(S,o,60)}
  lp.connect(gg);gg.connect(S.master);}
 {const o=O(S,'sine',1318),v=O(S,'sine',4.2),vg=G(S,9),gg=G(S);v.connect(vg);vg.connect(o.frequency);
  env(S,gg.gain,[[0,0],[20,0],[21,.018],[23.8,.018],[24.2,0],[43.8,0],[45,.012],[47,.015],[50,.022],[53.2,0],[60,0]]);
  o.connect(gg);gg.connect(S.master);gg.connect(S.rev);run(S,o,60);run(S,v,60);}
 fire(S,8,14.2,.3);fire(S,40,51,.7);
 whoosh(S,7.5,.6);whoosh(S,13.6,.5,.2);whoosh(S,23.5,.7);whoosh(S,39.4,.7,.25);whoosh(S,26,.3,.12);whoosh(S,43.5,.4,.15);
 for(const x of [8.8,10.1,11.4,12.7,13.8])creak(S,x,.45,.06);
 caw(S,14.7,.22);caw(S,17,.18);caw(S,20.5,.3);
 shot(S,20.5,w=>{for(let i=0;i<16;i++)burst(S,w+i*.055,.3*(1-i/17),.045,'lowpass',700)});
 creak(S,15.6,1.3,.14);creak(S,18.4,1.0,.18);
 for(const x of BEATS)beat(S,x,.9);
 KN.forEach((k,i)=>knock(S,k,i<3?.8:1.1));
 for(const L of DLG)L.ts.forEach((x,i)=>{const c=L.text[i];if(!/[\p{L}\p{N}]/u.test(c))return;blip(S,x,L.v,i)});
 for(const base of [33.35,34.1])for(let i=0;i<5;i++)shot(S,base+i*.07,w=>burst(S,w,.22,.035,'highpass',3000));
 if(S.t0<38.8){const gg=G(S);env(S,gg.gain,[[0,0],[35.2,0],[36.2,.05],[37.8,.05],[38.8,0]]);gg.connect(S.master);gg.connect(S.rev);
  for(const f of [293.66,369.99,440,587.33]){const o=O(S,'sine',f);o.connect(gg);run(S,o,38.8)}}
 for(const x of [35.8,36.35,37.2])shot(S,x,w=>{tone(S,w,'sine',2800,4200,.06,.09,.07);tone(S,w+.12,'sine',3600,2600,.05,.09,.07)});
 for(const x of [44,45,46])shot(S,x,w=>{burst(S,w,.35,.03,'highpass',2600);tone(S,w,'sine',2100,1900,.05,.03,.02)});
 shot(S,47.05,w=>{[[98,.45],[196.6,.28],[294,.18],[392.5,.1]].forEach(([f,v])=>tone(S,w,'sine',f,f*.99,v,4,3.9).connect(S.rev))});
 creak(S,47.4,1.8,.28);
 {let x=47.8,iv=.9;while(x<53){beat(S,x,.85);iv=Math.max(.32,iv*.9);x+=iv}}
 if(S.t0<53.2){const n=N(S),hp=F(S,'highpass',200),gg=G(S);
  env(S,hp.frequency,[[0,200],[50,200],[53.1,5000]]);env(S,gg.gain,[[0,0],[50,0],[53.1,.35],[53.18,0]]);
  n.connect(hp);hp.connect(gg);gg.connect(S.master);run(S,n,53.2);
  const o=O(S,'sawtooth',110),og=G(S);env(S,o.frequency,[[0,110],[50,110],[53.1,440]]);env(S,og.gain,[[0,0],[50,0],[53.1,.05],[53.18,0]]);
  o.connect(og);og.connect(S.master);run(S,o,53.2);}
 shot(S,53.2,w=>{const lp=F(S,'lowpass',2600),gg=G(S);
  gg.gain.setValueAtTime(0,w);gg.gain.linearRampToValueAtTime(1,w+.01);gg.gain.exponentialRampToValueAtTime(.001,w+3.2);
  lp.connect(gg);gg.connect(S.master);gg.connect(S.rev);
  for(const f of [110,116.5,155.6,164.8,233.1,246.9]){const o=reg(S,ac.createOscillator());o.type='sawtooth';o.frequency.value=f;const og=G(S,.08);o.connect(og);og.connect(lp);o.start(w);o.stop(w+3.3)}
  burst(S,w,.7,.6,'lowpass',4000).connect(S.rev);tone(S,w,'sine',65,28,.9,1.4,1);});
 shot(S,55.5,w=>{burst(S,w,1.1,.4,'lowpass',400).connect(S.rev);tone(S,w,'sine',55,32,1,.6,.4)});
}

/* ---------- controles ---------- */
const big=document.getElementById('big'),pp=document.getElementById('pp'),seek=document.getElementById('seek'),
 timeEl=document.getElementById('time'),muteB=document.getElementById('mute');
let playing=false,started=false,t0=0,base=0,muted=false,dragging=false;
function now(){if(!playing)return t0;return Math.min(DUR,t0+Math.max(0,ac.currentTime-base))}
function play(from){
 if(!ac)initAudio();ac.resume();
 if(from>=DUR-.05)from=0;
 t0=from;base=startSession(from);playing=true;started=true;big.style.display='none';pp.textContent='⏸';
}
function pause(){t0=now();playing=false;stopSession();pp.textContent='▶'}
big.onclick=()=>play(0);
pp.onclick=()=>playing?pause():play(t0);
seek.addEventListener('input',()=>{dragging=true;const v=+seek.value;if(playing)play(v);else{t0=v;started=true;big.style.display='none'}});
seek.addEventListener('change',()=>{dragging=false});
document.getElementById('px').onclick=()=>{PIX=!PIX};
muteB.onclick=()=>{muted=!muted;muteB.textContent=muted?'🔇':'🔊';if(out)out.gain.value=muted?0:.9};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();playing?pause():play(started?t0:0)}});
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function loop(){
 let t=now();
 if(playing&&t>=DUR){pause();t0=DUR;t=DUR;pp.textContent='↺'}
 draw(started?t:6.8);
 if(!dragging)seek.value=t;
 timeEl.textContent=`${fmt(t)} / 1:00`;
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
