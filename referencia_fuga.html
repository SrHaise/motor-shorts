<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuga — porta ou janela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Caveat:wght@600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#e9e4da;--muted:#8a857c;--accent:#d8261c;--bar:#141212;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--fg:#e9e4da;--bar:#141212}}
:root[data-theme="dark"]{--bg:#000;--fg:#e9e4da;--bar:#141212}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Oswald,"Arial Narrow",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
#stage{position:relative;aspect-ratio:9/16;
  width:min(calc(100vw - 16px),calc((100dvh - 110px) * 9 / 16));}
canvas{width:100%;height:100%;display:block;border-radius:10px;background:#000}
#big{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;padding:14px 26px;
  font:500 20px Oswald,"Arial Narrow",sans-serif;letter-spacing:.02em;color:#fff;background:rgba(150,12,8,.85);
  border:1px solid rgba(255,255,255,.25);border-radius:40px;cursor:pointer}
#big:focus-visible,#bar button:focus-visible,#seek:focus-visible{outline:2px solid #fff;outline-offset:3px}
#bar{display:flex;align-items:center;gap:10px;width:min(calc(100vw - 16px),calc((100dvh - 110px) * 9 / 16));
  min-width:280px;background:var(--bar);border-radius:30px;padding:6px 12px}
#bar button{background:none;border:0;color:var(--fg);font-size:18px;width:34px;height:34px;cursor:pointer;border-radius:50%}
#seek{flex:1;accent-color:var(--accent)}
#time{font-size:14px;color:var(--muted);min-width:78px;text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="720" height="1280"></canvas>
  <button id="big">▶ Assistir com som</button>
</div>
<div id="bar">
  <button id="pp" aria-label="Tocar ou pausar">▶</button>
  <input id="seek" type="range" min="0" max="36" step="0.01" value="0" aria-label="Posição no vídeo">
  <span id="time">0:00 / 0:36</span>
  <button id="px" aria-label="Alternar visual pixelado">▦</button>
  <button id="mute" aria-label="Som ligado ou mudo">🔊</button>
</div>
<script>
(()=>{
const W=1080,H=1920,DUR=36,SC=720/1080;
const cv=document.getElementById('cv'),G0=cv.getContext('2d');let g=G0;
const LO=document.createElement('canvas');LO.width=360;LO.height=640;const GL=LO.getContext('2d');let PIX=true;
const PX='"Press Start 2P", "Courier New", monospace';
if(document.fonts&&document.fonts.load)document.fonts.load('36px "Press Start 2P"');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sm=(a,b,x)=>{const k=clamp((x-a)/(b-a),0,1);return k*k*(3-2*k)};
const win=(t,a,b,f)=>Math.min(sm(a,a+f,t),1-sm(b-f,b,t));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=x=>{const s=Math.sin(x*127.1+311.7)*43758.5453;return s-Math.floor(s)};

/* ================= VISUAL ================= */
const CL=2000,HW=260,FY=230,CY=-330,FOC=560,NEAR=40;
const SDOORS=[[350,-1],[760,1],[1150,-1],[1460,1]],PICS=[[560,1],[960,-1],[1300,1]],PEEL=[[430,1],[880,-1],[1360,-1]];
function q(a,b,c,d){g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineTo(c[0],c[1]);g.lineTo(d[0],d[1]);g.closePath()}
function line(a,b,w){g.lineWidth=w;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}
function flick(t){if(hash(Math.floor(t*11))<.18)return .12;return .78+.22*Math.sin(t*37)*Math.sin(t*13)}

function entity(x,y,s,t,o={}){
 g.save();g.translate(x,y);g.scale(s,s);g.globalAlpha*=(o.alpha??1);
 if(o.run)g.translate(0,-Math.abs(Math.sin(t*9))*14);
 if(o.tilt){g.translate(0,-380);g.rotate(o.tilt);g.translate(0,380)}
 const robe=()=>{g.beginPath();g.moveTo(-62,-430);g.quadraticCurveTo(-98,-250,-128,0);
  for(let i=0;i<=10;i++)g.lineTo(-128+i*25.6,(i%2?-18:6)+Math.sin(t*12+i)*6);
  g.quadraticCurveTo(98,-250,62,-430);g.closePath()};
 g.fillStyle='#060608';robe();g.fill();
 g.strokeStyle='rgba(120,140,190,.35)';g.lineWidth=5;robe();g.stroke();
 g.fillStyle='#060608';g.beginPath();g.ellipse(0,-455,72,86,0,0,7);g.fill();
 g.beginPath();g.moveTo(-72,-455);g.quadraticCurveTo(-10,-600,40,-560);g.quadraticCurveTo(70,-520,72,-455);g.fill();
 g.strokeStyle='rgba(120,140,190,.35)';g.lineWidth=4;g.beginPath();g.ellipse(0,-455,72,86,0,Math.PI*1.05,Math.PI*1.95);g.stroke();
 g.fillStyle='#000';g.beginPath();g.ellipse(0,-438,42,54,0,0,7);g.fill();
 if(o.eyes){g.fillStyle='rgba(225,230,240,.9)';g.beginPath();g.arc(-14,-446,4.5,0,7);g.arc(14,-446,4.5,0,7);g.fill()}
 g.strokeStyle='#060608';g.lineWidth=34;g.lineCap='round';g.beginPath();g.moveTo(46,-380);g.lineTo(98,-470);g.stroke();
 g.fillStyle='#2a1a10';g.fillRect(90,-508,20,42);
 g.fillStyle='#c9cdd3';g.beginPath();g.moveTo(90,-508);g.lineTo(84,-610);g.lineTo(128,-650);g.lineTo(112,-508);g.fill();
 if(o.glint){g.fillStyle=`rgba(255,255,255,${o.glint})`;g.beginPath();g.moveTo(96,-600);g.lineTo(104,-560);g.lineTo(100,-620);g.fill();
  g.beginPath();g.arc(100,-600,10*o.glint,0,7);g.fill()}
 g.restore();
}

function corridor(o){
 const t=o.t,cz=o.cz,VX=540+(o.sx||0),VY=860+(o.sy||0),zE=o.zEnd||CL,n0=cz+NEAR;
 const cx=o.camX||0,P=(X,Y,Z)=>{const d=Math.max(NEAR,Z-cz),s=FOC/d;return [VX+(X-cx)*s,VY+Y*s,s]};
 g.fillStyle='#07080b';g.fillRect(-300,-300,W+600,H+600);
 g.fillStyle='#171a21';q(P(-HW,CY,n0),P(HW,CY,n0),P(HW,CY,zE),P(-HW,CY,zE));g.fill();
 g.fillStyle='#2b2019';q(P(-HW,FY,n0),P(HW,FY,n0),P(HW,FY,zE),P(-HW,FY,zE));g.fill();
 for(const sd of [-1,1]){const X=sd*HW;
  g.fillStyle='#394052';q(P(X,CY,n0),P(X,CY,zE),P(X,70,zE),P(X,70,n0));g.fill();
  g.fillStyle='#262a34';q(P(X,70,n0),P(X,70,zE),P(X,FY,zE),P(X,FY,n0));g.fill()}
 g.strokeStyle='rgba(0,0,0,.22)';
 for(let z=Math.ceil(n0/45)*45;z<zE;z+=45)for(const sd of [-1,1]){const a=P(sd*HW,CY,z);line(a,P(sd*HW,70,z),Math.max(1,2.5*a[2]))}
 g.strokeStyle='rgba(0,0,0,.42)';for(let X=-HW+45;X<HW;X+=45)line(P(X,FY,n0),P(X,FY,zE),2);
 g.strokeStyle='rgba(15,10,6,.85)';for(const sd of [-1,1])line(P(sd*HW,70,n0),P(sd*HW,70,zE),6);
 for(const [z,sd] of PEEL){if(z+120<n0||z>zE)continue;const X=sd*HW,z0=Math.max(z,n0);g.fillStyle='#4d5366';q(P(X,-250,z0),P(X,-228,z+120),P(X,-120,z+100),P(X,-160,z0));g.fill()}
 for(const [z,sd] of SDOORS){if(z+110<n0||z>zE)continue;const X=sd*HW,z0=Math.max(z,n0),z1=z+110;
  g.fillStyle='#0c0907';q(P(X,-132,Math.max(z0-8,n0)),P(X,-132,z1+8),P(X,FY,z1+8),P(X,FY,Math.max(z0-8,n0)));g.fill();
  g.fillStyle='#1d140e';q(P(X,-118,z0),P(X,-118,z1),P(X,FY,z1),P(X,FY,z0));g.fill();
  const k=P(X,30,z1-18);g.fillStyle='#6a5530';g.beginPath();g.arc(k[0],k[1],Math.max(1.5,6*k[2]),0,7);g.fill()}
 for(const [z,sd] of PICS){if(z+80<n0||z>zE)continue;const X=sd*HW,z0=Math.max(z,n0),z1=z+80;
  g.fillStyle='#120e0a';q(P(X,-240,z0),P(X,-222,z1),P(X,-108,z1),P(X,-126,z0));g.fill();
  g.fillStyle='#4a4034';q(P(X,-228,z0+10),P(X,-212,z1-10),P(X,-120,z1-10),P(X,-136,z0+10));g.fill()}
 const eA=P(-HW,CY,zE),eB=P(HW,FY,zE);
 g.fillStyle=o.back?'#040506':'#2e3446';g.fillRect(eA[0],eA[1],eB[0]-eA[0],eB[1]-eA[1]);
 if(!o.back){ // porta na parede da direita, perto do fim
  const z0=1720,z1=1880;
  g.fillStyle='#0c0806';q(P(HW,-150,z0-12),P(HW,-150,z1+12),P(HW,FY,z1+12),P(HW,FY,z0-12));g.fill();
  g.fillStyle='#2a1a10';q(P(HW,-135,z0),P(HW,-135,z1),P(HW,FY,z1),P(HW,FY,z0));g.fill();
  g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=3;q(P(HW,-110,z0+18),P(HW,-110,z1-18),P(HW,-5,z1-18),P(HW,-5,z0+18));g.stroke();
  q(P(HW,20,z0+18),P(HW,20,z1-18),P(HW,200,z1-18),P(HW,200,z0+18));g.stroke();
  const k=P(HW,40,z0+22);g.fillStyle='#b08d3c';g.beginPath();g.arc(k[0],k[1],Math.max(2,8*k[2]),0,7);g.fill()}
 const fog=o.fog??.72;
 const fg=g.createRadialGradient(VX,VY,0,VX,VY,780);fg.addColorStop(0,`rgba(3,4,7,${fog})`);fg.addColorStop(1,'rgba(3,4,7,0)');
 g.fillStyle=fg;g.fillRect(-300,-300,W+600,H+600);
 let winR=null;
 if(!o.back){
  const wa=P(-150,-265,zE),wb=P(150,60,zE);winR=[wa[0],wa[1],wb[0]-wa[0],wb[1]-wa[1]];
  const [wx,wy,ww,wh]=winR;
  g.fillStyle='#0c0907';g.fillRect(wx-ww*.08,wy-wh*.05,ww*1.16,wh*1.12);
  const sg=g.createLinearGradient(0,wy,0,wy+wh);sg.addColorStop(0,'#3d4f7a');sg.addColorStop(1,'#1a2440');g.fillStyle=sg;g.fillRect(wx,wy,ww,wh);
  g.save();g.beginPath();g.rect(wx,wy,ww,wh);g.clip();
  g.fillStyle='#e6e9f2';g.beginPath();g.arc(wx+ww*.68,wy+wh*.3,ww*.18,0,7);g.fill();
  g.fillStyle='#0b0f18';for(let i=0;i<6;i++){const px=wx+ww*(i/5),ph=wh*(.25+hash(i)*.2);g.beginPath();g.moveTo(px-ww*.15,wy+wh);g.lineTo(px,wy+wh-ph);g.lineTo(px+ww*.15,wy+wh);g.fill()}
  g.restore();
  g.fillStyle='#0c0907';g.fillRect(wx+ww/2-ww*.03,wy,ww*.06,wh);g.fillRect(wx,wy+wh*.5-wh*.02,ww,wh*.04);
  g.save();g.globalCompositeOperation='lighter';
  const mg=g.createRadialGradient(wx+ww/2,wy+wh/2,ww*.2,wx+ww/2,wy+wh/2,ww*3.2);mg.addColorStop(0,'rgba(110,140,210,.28)');mg.addColorStop(1,'rgba(110,140,210,0)');
  g.fillStyle=mg;g.fillRect(wx-ww*3.2,wy-ww*3.2,ww*7.4,ww*7.4);g.restore();
 }
 if(o.bz!=null&&o.bz>n0){
  const bz=o.bz,c1=P(0,CY,bz),c2=P(0,-178,bz),bp=P(0,-160,bz),b=o.bulb||0;
  g.strokeStyle='#050505';line(c1,c2,Math.max(1,2*bp[2]));
  if(!o.bulbGone){
   g.fillStyle=b>.3?'#fff2c0':'#4a4a44';g.beginPath();g.arc(bp[0],bp[1],Math.max(2,15*bp[2]),0,7);g.fill();
   if(b>0){g.save();g.globalCompositeOperation='lighter';const r=Math.min(1500,520*bp[2]+260);
    const lg=g.createRadialGradient(bp[0],bp[1],4,bp[0],bp[1],r);lg.addColorStop(0,`rgba(255,200,120,${.55*b})`);lg.addColorStop(.35,`rgba(255,170,90,${.18*b})`);lg.addColorStop(1,'rgba(255,170,90,0)');
    g.fillStyle=lg;g.fillRect(bp[0]-r,bp[1]-r,r*2,r*2);g.restore()}
  }else{g.fillStyle='#2a2a26';g.fillRect(bp[0]-6*bp[2],bp[1]-20*bp[2],12*bp[2],14*bp[2])}
  if(o.burstDt!=null&&o.burstDt>=0&&o.burstDt<1.2){const d=o.burstDt;
   for(let i=0;i<22;i++){const a=hash(i)*Math.PI*2,v=(120+hash(i+9)*260)*bp[2];
    g.fillStyle=i%3?`rgba(255,${200+i*2},140,${1-d})`:`rgba(220,230,240,${1-d/1.2})`;
    g.fillRect(bp[0]+Math.cos(a)*v*d,bp[1]+Math.sin(a)*v*d*.6+900*d*d*bp[2]*.4,4,4)}}
 }
 if(o.ent)o.ent(P);
 return {P,winR};
}
function shoulder(sx,sy){
 g.save();g.translate(sx*.4,sy*.4);
 g.fillStyle='#1c1f25';g.beginPath();g.ellipse(980,1860,470,330,-.25,0,7);g.fill();
 g.fillStyle='#16181d';g.beginPath();g.ellipse(930,1320,210,300,.15,0,7);g.fill();
 g.strokeStyle='rgba(140,155,190,.25)';g.lineWidth=6;g.beginPath();g.ellipse(930,1320,210,300,.15,Math.PI*1.1,Math.PI*1.6);g.stroke();
 g.strokeStyle='#2a2e36';g.lineWidth=10;g.beginPath();g.moveTo(760,1600);g.quadraticCurveTo(820,1500,900,1560);g.stroke();
 g.restore();
}
/* --- cenas do corredor --- */
function backView(t){
 const sx=Math.sin(t*23)*14,sy=Math.abs(Math.sin(t*11))*22;
 const off=(t>.35&&t<.5)||(t>.85&&t<1.05)||(t>1.25&&t<1.35);
 const b=off?0:flick(t)*.95,ze=570-t*150;
 corridor({t,cz:0,sx,sy,zEnd:1600,back:true,bz:430,bulb:b,fog:.75-.35*b,
  ent:P=>{const f=P(-20,FY,ze);entity(f[0],f[1],f[2],t,{run:true,alpha:off?.1:1,glint:off?.25:.6+.4*Math.sin(t*20)})}});
 shoulder(sx,sy);
}
const czRun=t=>{const u=clamp((t-2)/4,0,1);return 1380*(u*.85+.15*u*u)};
function frontView(t,o={}){
 const cz=o.cz??czRun(t);
 const bob=o.still?0:1,sx=(o.sx??Math.sin(t*7)*12*bob),sy=(o.sy??Math.sin(t*14)*16*bob);
 const burst=4.0,bOn=t<burst?flick(t):0;
 g.save();if(o.roll){g.translate(540,960);g.rotate(o.roll);g.translate(-540,-960)}
 const r=corridor({t,cz,camX:o.camX||0,sx,sy,bz:950,bulb:bOn,bulbGone:t>=burst,burstDt:t-burst,fog:.72-.3*bOn});
 g.restore();return r;
}
function stopView(t){
 const d=t-6,cz=1380+30*sm(6,6.4,t),sy=36*Math.sin(d*18)*Math.exp(-d*5);
 return frontView(t,{cz,sx:0,sy,still:true});
}
function freezeView(){
 const r=frontView(7.5,{cz:1410,sx:0,sy:0,still:true});
 g.save();g.globalCompositeOperation='saturation';g.fillStyle='rgba(128,128,128,.75)';g.fillRect(0,0,W,H);g.restore();
 g.fillStyle='rgba(0,0,0,.15)';g.fillRect(0,0,W,H);
 const dp=r.P(HW,-30,1800),[wx,wy,ww,wh]=r.winR;
 badge('1',dp[0]-30,dp[1]);badge('2',wx+ww/2,wy+wh/2);
 return r;
}
function badge(n,x,y){
 g.fillStyle='rgba(0,0,0,.7)';g.beginPath();g.arc(x,y,52,0,7);g.fill();
 g.strokeStyle='#fff';g.lineWidth=5;g.stroke();
 g.fillStyle='#fff';g.font='54px '+PX;g.textAlign='center';g.textBaseline='middle';g.fillText(n,x+3,y+5);
}
function glitch(t){
 freezeView();
 const fr=Math.floor(t*30);
 for(let i=0;i<14;i++){const y=hash(i*3.1+fr)*H,h=20+hash(i+fr*1.7)*120,dx=(hash(i*7+fr)-.5)*260;
  g.save();g.beginPath();g.rect(0,y,W,h);g.clip();g.translate(dx,0);g.fillStyle=`rgba(${i%3?255:0},${i%2?255:40},${i%3?40:255},.18)`;g.fillRect(0,y,W,h);g.restore();
  g.fillStyle='rgba(0,0,0,.5)';g.fillRect(dx>0?0:W+dx,y,Math.abs(dx),h)}
 g.globalAlpha=.35;g.drawImage(GRAIN[fr%6],0,0,W,H);g.globalAlpha=1;
}
function arms(p){
 if(p<=0)return;const y=1920+300-p*820;
 for(const sd of [-1,1]){g.save();g.translate(540+sd*70,y);g.rotate(sd*-.62);
  g.fillStyle='#2b2f37';g.beginPath();g.roundRect?g.roundRect(-560,-70,760,140,60):g.rect(-560,-70,760,140);g.fill();
  g.fillStyle='#1d2027';g.fillRect(150,-72,40,144);
  g.fillStyle='#b98b6c';g.beginPath();g.ellipse(250,0,70,58,0,0,7);g.fill();
  g.restore()}
}
/* --- exterior --- */
function sky(){const sg=g.createLinearGradient(0,-800,0,1400);sg.addColorStop(0,'#05070d');sg.addColorStop(1,'#1a2438');g.fillStyle=sg;g.fillRect(-1600,-1600,W+3200,H+3200);
 g.fillStyle='#cfd8ff';for(let i=0;i<70;i++){g.globalAlpha=.3+hash(i)*.5;g.fillRect(-500+hash(i+1)*2100,-900+hash(i+2)*1500,3,3)}g.globalAlpha=1}
function facade(t,o={}){
 // janela quebrada no centro (540,520); chão em y=1900
 g.fillStyle='#343b4c';g.fillRect(-900,150,W+1800,1800);
 g.strokeStyle='rgba(0,0,0,.3)';g.lineWidth=4;for(let y=190;y<1900;y+=42){g.beginPath();g.moveTo(-900,y);g.lineTo(W+900,y);g.stroke()}
 g.fillStyle='#171b24';g.beginPath();g.moveTo(-900,170);g.lineTo(W+900,170);g.lineTo(W+900,110);g.lineTo(-900,110);g.fill();
 g.fillStyle='#0a0c10';g.fillRect(-900,40,W+1800,80);
 // janela térrea escura
 for(const wx of [-300,1120]){g.fillStyle='#0b0d12';g.fillRect(wx,1250,260,330);g.fillStyle='#1c1812';g.fillRect(wx-12,1575,284,20)}
 const x0=380,y0=360,ww=320,wh=340;
 g.fillStyle='#120d09';g.fillRect(x0-22,y0-22,ww+44,wh+54);
 const ig=g.createLinearGradient(0,y0,0,y0+wh);ig.addColorStop(0,'#56648a');ig.addColorStop(1,'#2a3350');g.fillStyle=ig;g.fillRect(x0,y0,ww,wh);
 g.save();g.beginPath();g.rect(x0,y0,ww,wh);g.clip();
 if(o.ent)entity(530,y0+wh+175,.68,t,{tilt:o.tilt||0,glint:o.glint||0});
 g.restore();
 g.fillStyle='rgba(200,215,240,.55)';
 for(const pts of [[[x0,y0],[x0+60,y0],[x0,y0+90]],[[x0+ww,y0],[x0+ww-40,y0],[x0+ww,y0+70]],[[x0,y0+wh],[x0+50,y0+wh],[x0,y0+wh-60]],[[x0+ww,y0+wh],[x0+ww,y0+wh-80],[x0+ww-30,y0+wh]]]){g.beginPath();g.moveTo(...pts[0]);g.lineTo(...pts[1]);g.lineTo(...pts[2]);g.fill()}
 // cortina saindo pela janela
 const cw=Math.sin(t*2.3)*40;g.fillStyle='rgba(190,185,175,.75)';
 g.beginPath();g.moveTo(x0+10,y0);g.bezierCurveTo(x0-60+cw,y0+100,x0-110+cw*1.5,y0+220,x0-80+cw*2,y0+330);g.lineTo(x0+40,y0+wh-40);g.bezierCurveTo(x0+30,y0+220,x0+40,y0+100,x0+50,y0);g.fill();
 g.fillStyle='#1c1812';g.fillRect(x0-30,y0+wh+10,ww+60,24);

function sweep(S,x,dur,f0,f1,v,dest,q=1.4){shot(S,x,w=>{const n=reg(S,S.ac.createBufferSource());n.buffer=noiseBuf;const bp=F(S,'bandpass',f0,q);
 bp.frequency.setValueAtTime(f0,w);bp.frequency.exponentialRampToValueAtTime(f1,w+dur);const gg=G(S);
 gg.gain.setValueAtTime(0,w);gg.gain.linearRampToValueAtTime(v,w+dur*.6);gg.gain.exponentialRampToValueAtTime(.0001,w+dur);
 n.connect(bp);bp.connect(gg);gg.connect(dest);gg.connect(S.rev);n.start(w);n.stop(w+dur+.05)})}
function creak(S,x,dur,v,dest){shot(S,x,w=>{const o=reg(S,S.ac.createOscillator());o.type='sawtooth';
 const r=rng(Math.floor(x*100)),c=new Float32Array(64);for(let i=0;i<64;i++)c[i]=60+r()*55+35*Math.sin(i*.4);o.frequency.setValueCurveAtTime(c,w,dur);
 const bp=F(S,'bandpass',1000,5),gg=G(S);gg.gain.setValueAtTime(0,w);gg.gain.linearRampToValueAtTime(v,w+.06);gg.gain.setValueAtTime(v,w+dur-.12);gg.gain.linearRampToValueAtTime(0,w+dur);
 o.connect(bp);bp.connect(gg);gg.connect(dest);gg.connect(S.rev);o.start(w);o.stop(w+dur+.05)})}
function breath(S,x,dur,v,f,dest){shot(S,x,w=>{const n=reg(S,S.ac.createBufferSource());n.buffer=noiseBuf;const bp=F(S,'bandpass',f,1.1),gg=G(S);
 gg.gain.setValueAtTime(0,w);gg.gain.linearRampToValueAtTime(v,w+dur*.35);gg.gain.linearRampToValueAtTime(0,w+dur);
 n.connect(bp);bp.connect(gg);gg.connect(dest);n.start(w,Math.random());n.stop(w+dur+.05)})}
function groan(S,x,v,dest){shot(S,x,w=>{const o=reg(S,S.ac.createOscillator());o.type='sawtooth';o.frequency.setValueAtTime(128,w);o.frequency.linearRampToValueAtTime(96,w+.55);
 const bp=F(S,'bandpass',620,3),lp=F(S,'lowpass',1200),gg=G(S);gg.gain.setValueAtTime(0,w);gg.gain.linearRampToValueAtTime(v,w+.08);gg.gain.linearRampToValueAtTime(0,w+.6);
 o.connect(bp);bp.connect(lp);lp.connect(gg);gg.connect(dest);o.start(w);o.stop(w+.65)})}

/* barramentos: narração é a referência; demais em relação a ela */
const dB=d=>Math.pow(10,d/20);
function buses(S){
 const mk=(lvl,duck)=>{const b=G(S,dB(lvl));if(duck){const d=G(S,1);b.connect(d);d.connect(S.master);b.duck=d}else b.connect(S.master);return b};
 S.B={voice:mk(0),music:mk(-6,true),amb:mk(-16,true),sfx:mk(-4),hit:mk(+3)};
 // ducking: -6 dB em música e ambiente enquanto o texto é digitado
 const pts=[[0,1]];let last=0;
 for(const L of DLG){const a=L.a-.08,e=L.end+.1;if(a<=last)continue;pts.push([a,1],[L.a,.5],[e,.5],[e+.3,1]);last=e+.3}
 env(S,S.B.music.duck.gain,pts);env(S,S.B.amb.duck.gain,pts);
}
function blip(S,x,i){shot(S,x,w=>{const f=560+(i%3)*18;tone(S,w,'square',f,f*.97,.09,.045,.04,S.B.voice)})}

function score(S){
 const B=S.B;
 // ---------- música de perseguição (0–6s) ----------
 if(S.t0<6.2){
  const lp=F(S,'lowpass',420,2);lp.connect(B.music);
  const pat=[55,55,55,65.41,55,55,58.27,55],step=60/140/4;
  let k=0;for(let x=0;x<5.98;x+=step,k++){const up=x>=1.5?1.0595:1,f=pat[k%8]*up,acc=k%4===0;shot(S,x,w=>tone(S,w,'sawtooth',f,f*.98,acc?.55:.34,.1,.09,lp))}
  for(const x of [0,1.714,3.428,5.142])shot(S,x,w=>tone(S,w,'sine',60,30,.7,.7,.5,B.music));
  const tr=F(S,'lowpass',2200),tg=G(S),lfo=O(S,'sine',12),lg=G(S,.35);lfo.connect(lg);lg.connect(tg.gain);
  env(S,tg.gain,[[0,.07],[1.5,.09],[4,.12],[5.95,.15],[6.02,0]]);
  for(const f0 of [220,233.08]){const o=O(S,'sawtooth',f0);env(S,o.frequency,[[0,f0],[1.49,f0],[1.5,f0*1.0595],[6,f0*1.0595*1.06]]);o.connect(tr);run(S,o,6.1)}
  tr.connect(tg);tg.connect(B.music);run(S,lfo,6.1);
  for(let x=4;x<5.98;x+=step*2)shot(S,x,w=>burst(S,w,.3,.03,'highpass',7000,B.music));
 }
 // ---------- ambiente de casa ----------
 {const n=N(S),lp=F(S,'lowpass',260),gg=G(S);env(S,gg.gain,[[0,.8],[12,.8],[13.4,0],[25.4,0],[25.8,.8],[33.08,.8],[33.1,0],[36,0]]);n.connect(lp);lp.connect(gg);gg.connect(B.amb);run(S,n,33.2)}
 creak(S,2.8,.8,.5,B.amb);creak(S,9.4,1.1,.45,B.amb);creak(S,27.2,.9,.45,B.amb);
 // ---------- respiração ----------
 for(let x=0;x<7.4;x+=.45){breath(S,x,.2,.55,1700,B.sfx);breath(S,x+.2,.24,.45,1050,B.sfx)}
 for(let x=7.5;x<11.4;x+=.6){breath(S,x,.25,.3,1500,B.sfx);breath(S,x+.28,.28,.25,950,B.sfx)}
 for(let x=12;x<13.4;x+=.4){breath(S,x,.18,.55,1700,B.sfx);breath(S,x+.18,.2,.45,1050,B.sfx)}
 for(let x=16;x<25.2;x+=.9){breath(S,x,.35,.35,1400,B.sfx);breath(S,x+.4,.45,.3,900,B.sfx)}
 for(let x=25.6;x<31.2;x+=.36){breath(S,x,.16,.6,1800,B.sfx);breath(S,x+.17,.18,.5,1100,B.sfx)}
 breath(S,31.25,.5,.55,1800,B.sfx);
 // ---------- passos ----------
 const pstep=(x,v=.6)=>shot(S,x,w=>{burst(S,w,v,.07,'lowpass',650,B.sfx);tone(S,w,'sine',120,60,v*.5,.08,.06,B.sfx)});
 const estep=(x,v,dest)=>shot(S,x,w=>{tone(S,w,'sine',72,38,v,.22,.18,dest).connect(S.rev);burst(S,w,v*.7,.16,'lowpass',320,dest)});
 for(let x=0;x<1.5;x+=.28)pstep(x,.35);
 for(let x=2.05;x<6;x+=.27)pstep(x);
 for(let x=.1;x<7.4;x+=.5)estep(x,.8,B.sfx);
 {const mf=F(S,'lowpass',220);mf.connect(B.sfx);let v=.5;for(let x=7.6;x<11.4;x+=.5){estep(x,v,mf);v=Math.min(1,v+.06)}}
 {let v=.35;for(let x=27.6;x<30.4;x+=.55){estep(x,v,B.sfx);v+=.12}}
 // ---------- transições ----------
 sweep(S,1.5,.45,300,3500,.6,B.sfx);
 sweep(S,11.5,.5,4000,200,.7,B.sfx,2);for(let i=0;i<8;i++)shot(S,11.5+i*.06,w=>burst(S,w,.35,.03,'bandpass',1500+i*300,B.sfx));
 sweep(S,25.95,.4,300,3000,.45,B.sfx);sweep(S,32.0,.9,200,1200,.25,B.sfx);
 // lâmpada estoura
 shot(S,4,w=>{burst(S,w,.9,.3,'highpass',3000,B.hit);tone(S,w,'sine',420,90,.5,.08,.06,B.hit);for(let i=0;i<10;i++)burst(S,w+.05+i*.05*Math.random(),.25,.02,'highpass',4000,B.sfx)});
 // derrapada + música corta
 shot(S,6,w=>{const n=reg(S,S.ac.createBufferSource());n.buffer=noiseBuf;const bp=F(S,'bandpass',2600,3);bp.frequency.setValueAtTime(2600,w);bp.frequency.exponentialRampToValueAtTime(900,w+.35);
  const gg=G(S);gg.gain.setValueAtTime(0,w);gg.gain.linearRampToValueAtTime(.6,w+.02);gg.gain.exponentialRampToValueAtTime(.0001,w+.38);n.connect(bp);bp.connect(gg);gg.connect(B.sfx);n.start(w);n.stop(w+.4)});
 // ---------- escolha ----------
 {const lp=F(S,'lowpass',140),gg=G(S);env(S,gg.gain,[[0,0],[7.5,0],[8,.35],[11.3,.35],[11.5,0],[36,0]]);
  for(const f of [41.2,55]){const o=O(S,'sawtooth',f);o.connect(lp);run(S,o,11.6)}lp.connect(gg);gg.connect(B.music)}
 {let x=7.7,iv=.9;while(x<11.4){shot(S,x,w=>{tone(S,w,'sine',68,40,.8,.24,.14,B.sfx);tone(S,w,'triangle',136,80,.3,.12,.1,B.sfx);tone(S,w+.2,'sine',60,38,.5,.22,.14,B.sfx)});iv*=.94;x+=iv}}
 // ---------- final janela ----------
 shot(S,13.4,w=>{for(let i=0;i<7;i++)burst(S,w+i*.012,.9-i*.08,.15+Math.random()*.25,'highpass',3500+i*400,B.hit).connect(S.rev);
  for(let i=0;i<18;i++){const ww=w+.05+Math.random()*.8,f=3000+Math.random()*4000;tone(S,ww,'sine',f,f,.12,.08,.05,B.sfx)}});
 if(S.t0<15){const n=N(S),bp=F(S,'bandpass',300,.8),gg=G(S);env(S,bp.frequency,[[0,300],[13.45,300],[15,1600]]);
  env(S,gg.gain,[[0,0],[13.45,0],[13.6,.3],[14.95,1],[15,0]]);n.connect(bp);bp.connect(gg);gg.connect(B.sfx);run(S,n,15.05)}
 shot(S,15,w=>{tone(S,w,'sine',75,32,1,.5,.35,B.hit);burst(S,w,.9,.3,'lowpass',260,B.hit)});
 shot(S,15.07,w=>{burst(S,w,1,.035,'highpass',2600,B.hit);burst(S,w+.01,.8,.08,'bandpass',1300,B.hit,2)});
 if(S.t0<18){const o=O(S,'sine',5200),gg=G(S);env(S,gg.gain,[[0,0],[15.08,0],[15.12,.14],[17.8,0]]);o.connect(gg);gg.connect(B.sfx);run(S,o,17.9)}
 groan(S,15.7,.5,B.sfx);groan(S,17.1,.4,B.sfx);
 {const n=N(S),bp=F(S,'bandpass',420,.7),gg=G(S);env(S,gg.gain,[[0,0],[15.8,0],[17,.6],[25,.6],[25.5,0]]);n.connect(bp);bp.connect(gg);gg.connect(B.amb);run(S,n,25.6)}
 for(let x=16.5;x<25.2;x+=.45+hash(x)*.5)for(let i=0;i<3;i++)shot(S,x+i*.05,w=>tone(S,w,'sine',4500,4400,.35,.025,.02,B.amb));
 {const o=O(S,'sine',36.7),o2=O(S,'sine',1760),v=O(S,'sine',4),vg=G(S,8),gg=G(S),g2=G(S);v.connect(vg);vg.connect(o2.frequency);
  env(S,gg.gain,[[0,0],[18,0],[18.8,.5],[21,.5],[21.8,0]]);env(S,g2.gain,[[0,0],[18,0],[19,.05],[21,.05],[21.8,0]]);
  o.connect(gg);o2.connect(g2);gg.connect(B.music);g2.connect(B.music);g2.connect(S.rev);run(S,o,22);run(S,o2,22);run(S,v,22)}
 shot(S,19.95,w=>{tone(S,w,'sine',2800,2800,.18,1.2,1,B.sfx).connect(S.rev)});
 for(let x=21.2;x<25.2;x+=1.1){shot(S,x,w=>burst(S,w,.5,.07,'lowpass',1000,B.sfx));
  shot(S,x+.52,w=>{const n=reg(S,S.ac.createBufferSource());n.buffer=noiseBuf;const bp=F(S,'bandpass',650,1.5),gg=G(S);gg.gain.setValueAtTime(0,w);gg.gain.linearRampToValueAtTime(.3,w+.12);gg.gain.linearRampToValueAtTime(0,w+.4);n.connect(bp);bp.connect(gg);gg.connect(B.sfx);n.start(w,Math.random());n.stop(w+.45)})}
 groan(S,21.7,.45,B.sfx);groan(S,23.9,.4,B.sfx);
 // ---------- final porta ----------
 {const lp=F(S,'lowpass',180),gg=G(S);env(S,gg.gain,[[0,0],[25.5,0],[26,.3],[30.2,.4],[30.5,0],[36,0]]);
  for(const [ty,f] of [['sine',49],['sawtooth',98]]){const o=O(S,ty,f);o.connect(lp);run(S,o,30.6)}lp.connect(gg);gg.connect(B.music)}
 shot(S,26.8,w=>burst(S,w,.5,.03,'highpass',3000,B.sfx));
 shot(S,26.97,w=>{tone(S,w,'square',190,120,.35,.08,.06,B.sfx);burst(S,w,.7,.07,'bandpass',800,B.sfx,2)});
 for(const [a,b] of [[28.6,29.2],[29.8,30.4]])for(let x=a;x<b;x+=.06)shot(S,x,w=>burst(S,w,.45,.03,'highpass',2800,B.sfx));
 for(const x of [28.2,29.4])shot(S,x,w=>{tone(S,w,'sine',88,45,1,.35,.25,B.hit).connect(S.rev);burst(S,w,.8,.22,'lowpass',700,B.hit)});
 creak(S,32.3,.7,.8,B.sfx);
 shot(S,32.8,w=>{const n=reg(S,S.ac.createBufferSource());n.buffer=noiseBuf;const hp=F(S,'highpass',3000);hp.frequency.setValueAtTime(3000,w);hp.frequency.exponentialRampToValueAtTime(9000,w+.22);
  const gg=G(S);gg.gain.setValueAtTime(0,w);gg.gain.linearRampToValueAtTime(.7,w+.02);gg.gain.exponentialRampToValueAtTime(.0001,w+.25);n.connect(hp);hp.connect(gg);gg.connect(B.sfx);n.start(w);n.stop(w+.3);
  tone(S,w,'sine',3200,3200,.2,.3,.2,B.sfx);
  const st=G(S);st.gain.setValueAtTime(0,w);st.gain.linearRampToValueAtTime(.9,w+.006);st.gain.setValueAtTime(.9,w+.29);st.gain.setValueAtTime(0,w+.3);st.connect(B.hit);
  for(const f of [110,116.5,155.6,164.8,233.1]){const o=reg(S,S.ac.createOscillator());o.type='sawtooth';o.frequency.value=f;const og=G(S,.12);o.connect(og);og.connect(st);o.start(w);o.stop(w+.3)}});
 // ---------- narração (blips) ----------
 for(const L of DLG)L.ts.forEach((x,i)=>{if(/[\p{L}\p{N}]/u.test(L.text[i]))blip(S,x,i)});
}

/* ================= CONTROLES ================= */
const big=document.getElementById('big'),pp=document.getElementById('pp'),seek=document.getElementById('seek'),timeEl=document.getElementById('time'),muteB=document.getElementById('mute');
let playing=false,started=false,t0=0,base=0,muted=false,dragging=false;
function now(){if(!playing)return t0;return Math.min(DUR,t0+Math.max(0,ac.currentTime-base))}
function play(from){unlockIOS();if(!ac)initAudio();if(ac.state!=='running')ac.resume();if(from>=DUR-.05)from=0;t0=from;base=startSession(from);playing=true;started=true;big.style.display='none';pp.textContent='⏸'}
function pause(){t0=now();playing=false;stopSession();pp.textContent='▶'}
big.onclick=()=>play(0);
pp.onclick=()=>playing?pause():play(t0);
seek.addEventListener('input',()=>{dragging=true;const v=+seek.value;if(playing)play(v);else{t0=v;started=true;big.style.display='none'}});
seek.addEventListener('change',()=>{dragging=false});
document.getElementById('px').onclick=()=>{PIX=!PIX};
muteB.onclick=()=>{muted=!muted;muteB.textContent=muted?'🔇':'🔊';if(out)out.gain.value=muted?0:1};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();playing?pause():play(started?t0:0)}});
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function loop(){let t=now();if(playing&&t>=DUR){pause();t0=DUR;t=DUR;pp.textContent='↺'}
 draw(started?t:.7);if(!dragging)seek.value=t;timeEl.textContent=`${fmt(t)} / 0:36`;requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
